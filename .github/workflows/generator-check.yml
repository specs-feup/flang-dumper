name: Generator checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generator-check:
    name: Generated source and Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install protobuf tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler python3-protobuf

      - name: Run generated source checks
        run: /usr/bin/python3 scripts/check_generated.py
