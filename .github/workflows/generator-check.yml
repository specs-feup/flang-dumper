name: Generator checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generator-check:
    name: Generated source and Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run generated source checks
        run: python scripts/check_generated.py
