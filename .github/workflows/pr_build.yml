name: build

on:
  pull_request:
    branches: [main]

permissions:
  checks: write

env:
  FLANG_VERSION: 22

jobs:
  build-dumper:
    name: Build Dumper
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed if you plan to create/move tags in the runner
          persist-credentials: true

      - name: Install dependencies
        run: ./scripts/install-dependencies.sh

      - name: Build
        run: ./scripts/build.sh --no-copy

      - name: Smoke test
        run: |
          cat > /tmp/test.f90 <<'EOF'
          program hello
            print *, "hello"
          end program hello
          EOF
          flang-22 -fc1 -load ./build/DumpASTPlugin.so -plugin dump-ast /tmp/test.f90 > /tmp/ast.json
          test -s /tmp/ast.json